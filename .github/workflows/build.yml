name: Build

# Build and test, on every PR and on pushes to main. Two stages, in order:
#   1. "Build" - compiles MyRevoke, RevokeCraft, SandBox and MyRevoke-Tests.
#      A compile or link error fails here, and the tests never run.
#   2. "Test"  - runs MyRevoke-Tests. Fails if any test fails or the binary
#      crashes; doctest prints each failing assertion to this log.
#
# Windows runner because premake5.lua hardcodes RV_PLATFORM_WINDOWS and the
# project is built through generated Visual Studio files. The C# and native
# scripting projects are out of scope (#8).
#
# Keep the job named `build`: main's branch protection requires the checks
# "build (Debug)" and "build (Release)", and renaming the job would leave
# them waiting forever on every PR.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Generate Visual Studio solution
        run: .\vendor\premake\premake5.exe vs2022

      # Locates MSBuild with vswhere, which ships on the runner, instead of
      # using a setup-msbuild action - this repo only allows actions from a
      # short allowlist, and this needs nothing outside it.
      - name: Build
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          & $msbuild MyRevoke.sln -m -nologo "-t:MyRevoke;RevokeCraft;SandBox;MyRevoke-Tests" "-p:Configuration=${{ matrix.configuration }}" "-p:Platform=x64"

      - name: Test
        run: .\bin\${{ matrix.configuration }}-windows-x86_64\MyRevoke-Tests\MyRevoke-Tests.exe
