name: Claude Agent (implement + open PR)

# Lets you hand Claude a task from an issue or a comment. Depending on what
# you ask for, it either writes the code and opens a PR, or creates new
# GitHub issues - it never merges anything, that stays a human decision.
#
# Trigger it by:
#   - Adding the label "ai-task" to an issue, or
#   - Commenting "@claude <instruction>" on an issue or PR (GitHub fires
#     issue_comment for PR comments too, so both work)
#
# Examples:
#   - Label an issue "ai-task"          -> implements it, opens a PR
#   - "@claude fix the null deref in X" -> implements it, opens a PR
#   - "@claude open an issue for the
#      shader refactor we discussed"    -> creates that issue, no PR
#
# Optionally add one of these labels to the issue to pick which model
# implements it - defaults to Sonnet if none is present. These apply to
# both trigger types: a comment on an already-labelled issue/PR inherits
# whatever model:* label is already there, since GitHub includes the
# issue's current labels on every issue_comment event too.
#   - model:haiku  - trivial/cheap tasks
#   - model:sonnet - default, good balance for most tasks
#   - model:opus   - complex or high-stakes tasks
#
# Requires one auth secret: CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude-agent:
    # Security: this repo is public. Restrict this workflow to the repo
    # owner only - github.event.sender is whoever performed the triggering
    # action (added the label / wrote the comment), so this blocks anyone
    # else from invoking Claude with write access + your ANTHROPIC_API_KEY,
    # regardless of trigger type.
    if: >
      github.event.sender.login == 'Revokeeee' &&
      (
        (github.event_name == 'issues' && github.event.label.name == 'ai-task') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Pick model from issue labels
        id: pick-model
        env:
          LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q "model:opus"; then
            echo "model=claude-opus-5" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q "model:haiku"; then
            echo "model=claude-haiku-4-5" >> "$GITHUB_OUTPUT"
          else
            echo "model=claude-sonnet-5" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Claude Code Action
        # Pinned to the commit v1 pointed to on 2026-09-06, not the mutable
        # @v1 tag - an upstream change to that tag can't silently alter
        # what runs here with our write access + API key. Bump deliberately.
        #
        # Note: because this step opens PRs using secrets.GITHUB_TOKEN,
        # GitHub's recursion-prevention rule means those PRs will NOT
        # automatically trigger claude-pr-review.yml (or any other
        # workflow) the way a human-opened PR would. Automatic Copilot
        # review (configured as a repo ruleset) still fires on them since
        # it isn't gated by GITHUB_TOKEN-triggered events the same way -
        # but Claude's own PR-review workflow needs a manual nudge (e.g.
        # push an empty commit, or re-run the workflow) if you want it too.
        uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Two ways to authenticate - set whichever secret you prefer and
          # leave the other unset. CLAUDE_CODE_OAUTH_TOKEN draws against a
          # Claude Pro/Max subscription (generate with `claude setup-token`);
          # ANTHROPIC_API_KEY bills separately as pay-as-you-go API usage.
          # The action needs exactly one of them to be non-empty.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Headless CI has no human available to click "allow" on tool-use
          # prompts, so without this, Edit/Write/Bash all silently stall
          # waiting for an approval that never comes. Safe here specifically
          # because the job's `if:` above already restricts who can trigger
          # this workflow at all to the repo owner - this is not exposed to
          # arbitrary public input the way, say, a fork PR's code would be.
          claude_args: "--permission-mode bypassPermissions --model ${{ steps.pick-model.outputs.model }}"
          # Without this the step prints nothing between the prompt and the
          # final result, so a long run looks hung. It puts every message and
          # tool result in this public repo's Actions logs - nothing secret
          # should be in the repo, but remove this if that ever changes.
          show_full_output: true
          prompt: |
            You are working in the MyRevoke 2.0 (AI-driven) C++ game engine repo.

            ## Triggering issue/PR
            Number: #${{ github.event.issue.number }}
            Title: ${{ github.event.issue.title }}
            URL: ${{ github.event.issue.html_url }}
            Body:
            ${{ github.event.issue.body }}

            ## Triggering comment
            (Present only if this run was started by an @claude comment rather
            than the ai-task label - otherwise ignore this section. Note this
            may be a comment on an issue OR on a pull request.)
            ${{ github.event.comment.body }}

            ## Your task
            Use the title/body/comment above as the actual task description -
            it is not a placeholder, it is the real request. Work out which
            kind of task this actually is before doing anything:

            **A code change** - implement it:
            1. Break the task into concrete steps if needed
            2. Write code that matches the existing architecture (ECS, Premake, modular design)
            3. Test your assumptions (read the code first, don't guess)
            4. When done, open a PR with a clear title saying what changed.
               `gh pr create --body` bypasses the repo's PR template, so read
               `.github/pull_request_template.md` yourself and write the body
               following that structure - it is the source of truth, use
               whatever sections it currently has rather than a remembered
               version. Keep it short: read `.github/WRITING_STYLE.md` first
               and follow its limits (the whole body under 150 words).
               - Summary: what changed and why, 3 sentences max, link the issue
               - Checklist: tick honestly. For tests, one line on how you
                 verified it. Tick "needs close human review" if the change
                 involves a structural decision or anything you are unsure of.
               - Notes for AI review / human review: 3 bullets max each, only
                 what the reader must know or decide. Write "None." otherwise.
               Don't explain how the code works (the diff does), and don't
               defend your choices against the reviewer in advance.

            **New issue(s) requested** - e.g. "create an issue for X", often
            said in a comment on some other issue or PR. Create them directly
            with `gh issue create`. Give each a clear, specific title and a
            body with real context: what the work is, why it's needed, where
            it came from (link the issue/PR that prompted it), and concrete
            acceptance criteria where you can state them.

            Every issue title starts with one or more area tags in square
            brackets, then a short description: `[Scripting] Make hot reload
            failure-safe`, `[Installer][Game Export] Add a Dist build
            configuration`. A tag names an engine area or feature, never a
            kind of work, so `[Scripting]` or `[UI]`, not `[Bug]` or
            `[Feature]` (labels already carry that). Before inventing a tag,
            reuse one already in use: run
            `gh issue list --state all --limit 100 --json title --jq '.[].title'`
            and pick from the leading `[...]` tags (a bracket holding only a
            number is the order, not a tag). Add a new tag only when no
            existing one fits.

            When an issue is one of a set filed together, or is listed in a
            parent issue's checklist, add its **order of execution** as a
            last bracket holding only a number: `[Scripting][3] Make hot
            reload failure-safe`. 1 is done first. Number in dependency
            order, so an issue that depends on another comes after it. The
            parent issue itself and standalone issues get no number. When
            you add an issue to an existing set, give it the next number, or
            renumber the later ones (`gh issue edit <n> --title ...`) if it
            has to come earlier. An issue shared by two parents keeps the
            same number in both lists.

            Keep issue bodies short, per `.github/WRITING_STYLE.md`: a
            3-sentence context, a few bullets of what to do, a few checkable
            acceptance criteria, under 200 words.

            Creating the issue(s) is the whole task - do not also write code
            or open a PR for it. Only create issues when actually asked to; never spawn
            them on your own initiative during a code task.

            If it's genuinely ambiguous which of the two is wanted, make the
            call yourself and say briefly which you picked and why in the PR
            description, issue body, or a comment.

            ## Gathering context cheaply

            Before reasoning about design or writing code, use the Task tool
            with `model: haiku` to delegate broad, mechanical exploration -
            "read through these N files and summarize", "find every caller
            of X", "map out how the scene serialization format works" - to a
            cheap subagent instead of doing that reading yourself. Reserve
            your own turns for judgment calls, architecture decisions, and
            actually writing the code. Skip this for anything already small
            enough that delegating it would cost more than it saves.

            ## How to write the code

            The simplest thing that actually solves the stated problem, and
            nothing beyond it.

            - **Smallest change that works.** Prefer adding to what's there
              over restructuring it. If the task can be done in twenty lines
              in one file, don't do it in two hundred across five.
            - **Non-destructive by default.** Don't rewrite, refactor or
              reorganise working code the task didn't ask you to touch, even
              where you'd have written it differently. Don't delete code that
              still has callers. If the task genuinely can't be done without
              a structural change - to how scenes, entities, serialization or
              the renderer are organised - do the smallest version that works
              and flag the bigger decision in the PR's "Notes for human
              review" rather than making that call unilaterally.
            - **Readable over clever.** Clear names, small functions, obvious
              control flow. This is a learning project - someone still
              learning C++ should be able to follow what you wrote. No clever
              one-liners, nothing that needs a comment to explain what the
              language is doing.
            - **No over-engineering.** No interfaces, abstraction layers,
              template machinery, config options or generality for cases that
              don't exist yet. Solve the case in front of you. Don't optimise
              anything that isn't measurably slow.
            - **Match what's already here.** Use the patterns, style and
              conventions the codebase already uses (C++20, smart pointers,
              snake_case for functions/vars, PascalCase for classes) rather
              than importing a new one. Consistency with the surrounding code
              beats your own preference.
            - **Comments explain why, never what.** Only write a comment when
              the code alone can't carry the reasoning - a non-obvious
              constraint, a workaround for a specific bug, an invariant the
              reader could easily violate. If you're tempted to comment what
              a line does, rename things or restructure until it doesn't need
              one instead. Skip comments entirely when there's no genuine why
              to explain - most changes don't need any.
            - **Established structural patterns, not novel ones.** Reach for
              well-known, widely-understood designs (composition, dependency
              injection via constructor/parameters, observer/event-driven
              where the codebase already is, RAII for resource ownership)
              over inventing your own. Avoid singletons and other global
              mutable state for anything new - pass dependencies explicitly
              instead - even if similar existing code already uses one; don't
              propagate that pattern further.

            Watch for memory and performance mistakes as you go. If you find
            bugs in existing code while working, fix them and note it - unless
            fixing one would mean a structural change, in which case flag it
            instead.

            ## Writing GitHub Actions workflows

            This repo enforces rules you can't see from the files, so a
            workflow that ignores them fails before its first step runs:

            - Every `uses:` must be pinned to a full 40-character commit SHA,
              with the version as a trailing comment, e.g.
              `uses: actions/checkout@<sha> # v4`. Tags like `@v4` are rejected.
              Get the SHA with `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`,
              which resolves annotated tags to the commit for you.
            - Only actions from GitHub itself (`actions/*`), verified
              creators, and `anthropics/*` are allowed.
            - When you copy conventions from an existing workflow, read the
              whole file. The pinned `uses:` lines sit below the first 30-40
              lines, so `head` will miss them.
            - Check issue numbers you cite in comments against
              `gh issue view` rather than guessing.

            ## If you cannot finish

            Pushes can be rejected - for example, creating or editing anything
            under `.github/workflows/` can fail with "without `workflows`
            permission" - and PR creation can fail too. Your runner is
            destroyed when this job ends, so a commit that only exists locally
            is lost and the person reading the Actions log is the only one who
            will ever know. If a push or `gh pr create` fails, do not retry or
            hunt for workarounds. Instead, post one comment on #${{ github.event.issue.number }}
            with `gh issue comment ${{ github.event.issue.number }} --body-file <file>`
            (write the body to a temp file first; it avoids shell quoting
            problems) that contains:

            1. What you were asked to do and what you finished.
            2. The exact error message.
            3. The full content of every file you created or changed, in
               fenced code blocks (or `git diff origin/main...HEAD` if that
               is shorter), so a human can apply it without re-deriving
               anything. If it exceeds GitHub's 65,000-character comment
               limit, split it across several comments.

            You never merge pull requests, and you never approve them - a
            human always makes that call.
