name: Bug
description: Something is broken or behaves wrongly
title: "[Area] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Start the title with an area tag in square brackets, like `[Scripting]` or `[UI]`.
        A tag names an engine area or feature, not a kind of work. Reuse a tag that's
        already in use where one fits. If this issue is part of a sequence, add its order of
        execution as a last bracket with just a number (`[Scripting][3]`, 1 = first). Parent and
        standalone issues get no number.
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What goes wrong? Include any crash message or log output.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The steps that trigger it.
      placeholder: "1. Open ...\n2. Press Play\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen instead
  - type: textarea
    id: where
    attributes:
      label: Where in the code
      description: Files, functions or line numbers, if you know them.
